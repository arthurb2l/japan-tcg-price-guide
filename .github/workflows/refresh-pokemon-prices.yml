name: Refresh Pokemon Prices (TCGdex)
# Weekly refresh of every Pokemon card's Cardmarket + TCGplayer price from the free TCGdex API (#77).
# The old monthly "Update Prices from API" workflow only covered 4 hand-picked cards.

on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 03:00 UTC (12:00 JST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh prices
        run: node scripts/fetch-pokemon-prices.js all --concurrency 8
      - name: Rebuild price series
        run: node scripts/price-snapshot.js && node scripts/build-price-series.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shards/ data/price-history/ data/price-series/
          git diff --staged --quiet || git commit -m "💴 Pokemon prices (TCGdex): $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
