name: Update JP Prices (v2)
on:
  # No schedule: Surugaya + Yuyutei block GitHub runner IPs (403), so a CI scan
  # overwrites 3-source prices with Cardrush-only ones. The regular scan runs on
  # Arthur's PC via scripts/local-price-scan.sh (triggered by /triage-q-projects).
  workflow_dispatch: # Manual fallback (Cardrush-only)

permissions:
  contents: write

jobs:
  scan-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours max
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run price scanner (3 JP sources)
        run: |
          mkdir -p data/prices/history
          python3 scripts/price-scan.py --resume --save-every 20
        timeout-minutes: 150
        continue-on-error: true

      - name: Sync prices back to cache (for website)
        run: |
          python3 scripts/sync-prices-to-cache.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📈 JP price scan: $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push  # fail loudly: a swallowed push hid 5 months of lost scans
