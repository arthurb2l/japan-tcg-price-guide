name: Detect New One Piece Sets

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC (3pm JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new sets
        run: |
          # Series dropdown labels carry the set code, e.g. "...ROMANCE DAWN【OP-01】"
          CODES=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "User-Agent: Mozilla/5.0 (Japan-TCG-Price-Guide)" \
            -d "series=550101" \
            "https://www.onepiece-cardgame.com/cardlist/" \
            | grep -oP '<option value="55\d+"[^>]*>[^<]*【\K[A-Z]+-\d+(?=】)' | sort -u)

          if [ -z "$CODES" ]; then
            echo "::error::Could not parse any set codes from the official cardlist"
            exit 1
          fi
          echo "Official JP sets: $(echo "$CODES" | wc -l)"

          NEW_SETS=$(echo "$CODES" | node -e "
            const d = JSON.parse(require('fs').readFileSync('data/onepiece-cache.json','utf8'));
            const codes = require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean);
            console.log(codes.filter(c => !d.sets[c]).join(' '));
          ")

          if [ -n "$NEW_SETS" ]; then
            echo "NEW_SETS_FOUND=true" >> $GITHUB_ENV
            echo "NEW_SETS=$NEW_SETS" >> $GITHUB_ENV
            echo "🆕 New sets detected: $NEW_SETS"
          else
            echo "NEW_SETS_FOUND=false" >> $GITHUB_ENV
            echo "✅ No new sets detected"
          fi

      - name: Create or update issue for new sets
        if: env.NEW_SETS_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const newSets = process.env.NEW_SETS.trim();
            const title = `New One Piece sets missing from cache: ${newSets}`;
            const body = `## Auto-detected new sets\n\nThe weekly scan found sets on the official Bandai cardlist that are not in \`data/onepiece-cache.json\`:\n\n${newSets.split(' ').map(s => '- ' + s).join('\n')}\n\n### Action needed\n\`\`\`bash\nnode scripts/fetch-op-official-cardlist.js --all --lang jp --update\nnode scripts/fetch-op-official-cardlist.js --all --lang en --update\n\`\`\`\n\nThen push the updated cache.\n\n_Auto-generated by detect-new-sets workflow — this issue is updated in place each week._`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'auto-detected', state: 'open', per_page: 100
            });
            if (open.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, title, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['enhancement', 'auto-detected']
              });
            }
